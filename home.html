<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintFlow - Home</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="logo">🖨️</div>

    <h1>Upload PDF</h1>

    <p class="description">
        Select your PDF document to print.
    </p>

    <input
        type="file"
        id="pdfFile"
        accept=".pdf"
        style="display: none;"
        onchange="if(window.handleFileSelection) window.handleFileSelection(event);"
    >

    <button type="button" id="choosePdfBtn" onclick="var el=document.getElementById('pdfFile'); if(el){ el.value=''; el.click(); }">
        📄 Choose PDF
    </button>

    <!-- PDF First Page Preview Thumbnail Container -->
    <div id="pdfPreviewContainer" style="display: none; margin-top: 14px; text-align: center;">
        <canvas id="pdfCanvas" style="max-width: 140px; max-height: 180px; border-radius: 10px; border: 2px solid #fed7aa; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.12); margin-bottom: 8px;"></canvas>
    </div>

    <p id="fileName" style="font-weight: 700; color: #1e293b; margin-top: 10px;">
        No PDF Selected
    </p>
    <p id="pageCount" style="font-size: 13px; font-weight: 600; color: #ea580c; margin-top: 4px; display: none;"></p>

    <button type="button" id="continueBtn" style="margin-top: 18px;">
        Continue
    </button>

    <!-- Inline Validation Error Message below Continue button -->
    <div id="pdfErrorMsg" class="otp-error-msg" style="display: none; margin-top: 18px; margin-bottom: 0;">
        📄 Please select a PDF file first
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="script.js"></script>

</body>
</html>
