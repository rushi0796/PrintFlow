<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=login.html">
    <title>PrintFlow - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<script>
    localStorage.removeItem("mobileNumber");
    sessionStorage.removeItem("printflowAdminUnlocked");
    window.location.replace("login.html");
</script>

    <div class="container">

        <div class="brand-header">
            <div class="brand-logo-wrapper">
                <img src="logo.png" alt="PrintFlow Logo" class="brand-logo-img">
            </div>
        </div>

        <p class="subtitle">
            Smart & Fast Xerox Printing
        </p>

        <p class="description">
            Login with your mobile number to continue.
        </p>

        <input
            type="tel"
            id="phone"
            placeholder="Enter Mobile Number"
            maxlength="10"
        >

        <button id="sendOtpBtn">
            Send OTP
        </button>

        <div id="otpSection" style="display:none;">

            <input
                type="text"
                id="otp"
                placeholder="Enter OTP"
                maxlength="6"
            >

            <button id="verifyOtpBtn">
                Verify OTP
            </button>

        <footer class="app-footer">
            <div class="footer-links">
                <a href="privacy-policy.html" class="footer-link">Privacy Policy</a>
                <span class="footer-divider">|</span>
                <a href="terms.html" class="footer-link">Terms &amp; Conditions</a>
                <span class="footer-divider">|</span>
                <a href="refund-policy.html" class="footer-link">Refund Policy</a>
                <span class="footer-divider">|</span>
                <a href="mailto:printflowindia@gmail.com" class="footer-link">Contact Support</a>
            </div>
            <div class="footer-copyright">
                &copy; 2026 PrintFlow. All rights reserved.
            </div>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
