<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Details - PrintFlow</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container print-settings-page">

    <div class="logo">🖨️</div>

    <h1>Print Details</h1>
    <p id="fileName">No file selected</p>
    <p id="pageCount"></p>

    <p class="description">
        Select copies and print settings for your document.
    </p>

    <section class="settings-section" aria-label="Print settings">
        <div class="settings-grid">
            <label class="setting-field">Copies
                <input type="number" id="copies" value="1" min="1" max="999">
            </label>
            <label class="setting-field">Paper Size
                <select id="paperSize">
                    <option value="A3">A3</option><option value="A4" selected>A4</option><option value="A5">A5</option>
                    <option value="Letter">Letter</option><option value="Legal">Legal</option><option value="Executive">Executive</option><option value="Custom">Custom Size</option>
                </select>
            </label>
            <fieldset class="setting-field setting-field-wide"><legend>Print Side</legend>
                <div class="option-grid"><label><input type="radio" name="printSide" value="single"> Single Side</label><label><input type="radio" name="printSide" value="double" checked> Double Side</label></div>
            </fieldset>
            <fieldset class="setting-field setting-field-wide"><legend>Color Mode</legend>
                <div class="option-grid"><label><input type="radio" name="colorMode" value="black_white" checked> Black &amp; White</label><label><input type="radio" name="colorMode" value="color"> Color</label><label><input type="radio" name="colorMode" value="micro_xerox"> Micro Xerox</label></div>
            </fieldset>
            <fieldset class="setting-field setting-field-wide"><legend>Orientation</legend>
                <div class="option-grid"><label><input type="radio" name="orientation" value="portrait" checked> Portrait</label><label><input type="radio" name="orientation" value="landscape"> Landscape</label><label><input type="radio" name="orientation" value="auto"> Auto Detect</label></div>
            </fieldset>
            <label class="setting-field">Page Range
                <select id="pageRangeMode"><option value="all" selected>All Pages</option><option value="custom">Custom Pages</option></select>
                <input type="text" id="pageRange" placeholder="1-3,6,9" style="display:none;" pattern="[0-9, -]+">
            </label>
            <label class="setting-field">Scaling
                <select id="scaling"><option value="actual_size" selected>Actual Size (100%)</option><option value="fit">Fit to Page</option><option value="fill">Fill Page</option><option value="custom">Custom Scale</option></select>
                <input type="number" id="customScale" value="100" min="10" max="500" step="1" style="display:none;" aria-label="Custom scale percentage">
            </label>
            <label class="setting-field">Margins
                <select id="margins"><option value="none">None</option><option value="narrow">Narrow</option><option value="normal">Normal</option><option value="wide">Wide</option><option value="default" selected>Default Printer Margins</option></select>
            </label>
        </div>
    </section>

    <section id="microXeroxSettings" class="micro-xerox-panel" hidden aria-label="Micro Xerox settings">
        <h3>Micro Xerox Settings</h3>
        <div class="settings-grid">
            <label class="setting-field">Pages Per Sheet
                <select id="pagesPerSheet"><option value="2">2</option><option value="4" selected>4</option><option value="6">6</option><option value="9">9</option><option value="16">16</option></select>
            </label>
            <label class="setting-field">Page Order
                <select id="pageOrder"><option value="horizontal" selected>Horizontal</option><option value="vertical">Vertical</option></select>
            </label>
        </div>
        <div class="micro-summary" id="microSummary"></div>
    </section>

    <div id="printPreview" class="print-preview">
        <strong>Print Preview</strong>
        <div id="previewLayout" class="preview-layout" aria-label="Live page preview"></div>
        <p id="previewSummary">A4 · Portrait · B&amp;W · 1 copy</p>
    </div>

    <h2 id="totalPrice">
        Total: --
    </h2>

    <div class="button-row">
        <button type="button" id="backBtn" class="secondary-btn">← Back</button>
        <button type="button" id="paymentBtn">Continue to Payment</button>
    </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="script.js"></script>

</body>
</html>
