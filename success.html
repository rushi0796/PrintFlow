<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success & Privacy Confirmation - PrintFlow</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="logo">✅</div>

    <h1>Payment Successful</h1>

    <p class="description">
        Your payment has been received and your document is printing.
    </p>

    <!-- PROMINENT PRIVACY CONFIRMATION CARD -->
    <div id="privacyConfirmationCard" style="background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border: 1.5px solid #86efac; border-radius: 16px; padding: 20px; text-align: center; margin: 18px 0; box-shadow: 0 8px 20px rgba(22, 163, 74, 0.12);">
        <div style="font-size: 32px; margin-bottom: 6px;">🔒</div>
        <h3 style="margin: 0 0 6px; color: #15803d; font-size: 20px; font-weight: 800;">✓ Your files are safe</h3>
        <p id="privacyStatusText" style="margin: 0; color: #166534; font-size: 14px; font-weight: 600;">Your documents have been securely deleted after printing.</p>
    </div>

    <div class="status-box" style="margin-top: 14px;">
        <p><strong>Payment Status:</strong> ✅ Successful</p>
        <p><strong>Document Privacy:</strong> <span id="docCleanupBadge" style="color: #15803d; font-weight: 700;">DELETED</span></p>
        <p><strong>Order Reference:</strong> <span id="successOrderId">PF-VERIFIED</span></p>
    </div>

    <button type="button" id="homeBtn" style="margin-top: 18px;">Back to Home</button>

</div>

<script src="script.js"></script>

</body>
</html>
