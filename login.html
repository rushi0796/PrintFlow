<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrintFlow - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="icon">🖨️</div>

        <h1>PrintFlow</h1>

        <p class="subtitle">Smart & Fast Xerox Printing</p>

        <p class="description">Login with your mobile number to continue.</p>

        <!-- MOBILE LOGIN -->
        <form id="mobileForm">

            <div id="mobileSection">

                <input
                    type="tel"
                    id="mobileNumber"
                    name="mobileNumber"
                    placeholder="Enter Mobile Number"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                    enterkeyhint="go"
                >

                <button
                    type="button"
                    id="sendOtpBtn"
                    style="cursor: pointer; pointer-events: auto;"
                >
                    Send OTP
                </button>

                <div
                    id="sendOtpSuccessMsg"
                    class="success-text-anim"
                    style="
                        display:none;
                        margin-top:10px;
                        font-size:14px;
                        color:#16a34a;
                    "
                >
                    ✓ OTP sent successfully
                </div>

            </div>

        </form>


        <!-- OTP SECTION -->
        <div id="otpSection" style="display:none;">

            <p class="otp-sent-text">
                Enter 4-digit OTP sent to your phone
            </p>

            <form id="otpForm">

                <div
                    class="otp-box-container"
                    id="otpBoxContainer"
                >

                    <input
                        type="text"
                        class="otp-box"
                        maxlength="1"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        autocomplete="one-time-code"
                        enterkeyhint="done"
                    >

                    <input
                        type="text"
                        class="otp-box"
                        maxlength="1"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        enterkeyhint="done"
                    >

                    <input
                        type="text"
                        class="otp-box"
                        maxlength="1"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        enterkeyhint="done"
                    >

                    <input
                        type="text"
                        class="otp-box"
                        maxlength="1"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        enterkeyhint="done"
                    >

                </div>


                <!-- ERROR -->
                <div
                    id="otpErrorMsg"
                    class="otp-error-msg"
                    style="display:none;"
                >
                    Invalid OTP. Please try again.
                </div>


                <!-- HIDDEN OTP -->
                <input
                    type="hidden"
                    id="otpInput"
                    maxlength="4"
                >


                <!-- VERIFY -->
                <button
                    type="submit"
                    id="verifyOtpBtn"
                    style="cursor:pointer; pointer-events:auto;"
                >
                    Verify OTP
                </button>

            </form>


            <!-- RESEND -->
            <div class="resend-container">

                <span id="resendTimer">
                    Resend OTP in 30s
                </span>

                <button
                    type="button"
                    id="resendBtn"
                    class="resend-btn"
                    style="display:none;"
                >
                    Resend OTP
                </button>

            </div>


            <!-- RESEND SUCCESS -->
            <div
                id="resendSuccessMsg"
                class="success-text-anim"
                style="
                    display:none;
                    margin-top:10px;
                    font-size:14px;
                    color:#16a34a;
                    text-align:center;
                "
            >
                ✓ OTP resent successfully
            </div>

        </div>

        <!-- RAZORPAY REVIEWER / DEMO LOGIN OPTION -->
        <div style="margin-top: 24px; padding-top: 16px; border-top: 1.5px dashed #fed7aa; text-align: center;">
            <button type="button" id="toggleReviewerLoginBtn" style="background: transparent; border: 1.5px solid #ea580c; color: #ea580c; border-radius: 12px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;">
                🔑 Razorpay Reviewer Login
            </button>
            
            <form id="reviewerLoginForm" style="display: none; margin-top: 16px; text-align: left; background: #fff7ed; padding: 16px; border-radius: 16px; border: 1px solid #ffedd5;">
                <p style="font-size: 13px; font-weight: 700; color: #ea580c; margin-bottom: 10px; text-align: center;">
                    Razorpay Reviewer Authentication
                </p>
                <label style="font-size: 12px; font-weight: 700; color: #431407; display: block; margin-bottom: 4px;">Reviewer Mobile:</label>
                <input type="tel" id="reviewerMobile" value="9999999999" maxlength="10" style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #fdba74; font-size: 13px; font-weight: 600; margin-bottom: 12px;">
                
                <label style="font-size: 12px; font-weight: 700; color: #431407; display: block; margin-bottom: 4px;">Reviewer Access Key:</label>
                <input type="password" id="reviewerAccessKey" placeholder="Enter Access Key" style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #fdba74; font-size: 13px; font-weight: 600; margin-bottom: 14px;">
                
                <div id="reviewerErrorMsg" style="display: none; color: #dc2626; font-size: 12px; font-weight: 700; margin-bottom: 10px; text-align: center;"></div>
                
                <button type="submit" id="reviewerLoginSubmitBtn" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%); color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer;">
                    Login as Reviewer ➔
                </button>
            </form>
        </div>

    </div>


    <!-- MSG91 CONFIGURATION -->
    <script>

        window.msg91Ready = false;

        var configuration = {

            widgetId: "36686b654e49383431323836",

            /*
             * IMPORTANT:
             * Keep your existing MSG91 tokenAuth here.
             */
            tokenAuth: "559394TpZLWk3u6a854b09P1",

            exposeMethods: true,

            success: function (data) {
                console.log(
                    "MSG91 Success Callback:",
                    data
                );
            },

            failure: function (error) {
                console.error(
                    "MSG91 Failure Callback:",
                    error
                );
            }

        };


        function onMsg91Loaded() {

            console.log("MSG91 SDK loaded");

            if (typeof initSendOTP === "function") {

                try {

                    initSendOTP(configuration);

                    console.log(
                        "MSG91 initialization started"
                    );

                } catch (error) {

                    console.error(
                        "MSG91 initialization error:",
                        error
                    );

                }

            } else {

                console.error(
                    "initSendOTP function not found"
                );

            }


            /*
             * Wait until MSG91 exposes
             * sendOtp / verifyOtp / retryOtp
             */
            var checkTimer = setInterval(function () {

                if (
                    typeof window.sendOtp === "function"
                ) {

                    clearInterval(checkTimer);

                    window.msg91Ready = true;

                    console.log(
                        "MSG91 OTP methods are ready"
                    );

                    window.dispatchEvent(
                        new Event("msg91-ready")
                    );

                }

            }, 100);


            /*
             * Stop checking after 15 seconds
             */
            setTimeout(function () {

                clearInterval(checkTimer);

                if (!window.msg91Ready) {

                    console.error(
                        "MSG91 OTP service did not become ready"
                    );

                }

            }, 15000);

        }

    </script>


    <!-- MSG91 SDK -->
    <script
        type="text/javascript"
        src="https://verify.msg91.com/otp-provider.js"
        onload="onMsg91Loaded()"
        onerror="console.error('MSG91 SDK failed to load')"
    ></script>


    <!-- YOUR LOGIN JS -->
    <script src="login.js"></script>


    <!-- EXTRA SAFETY CHECK -->
    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const button =
                    document.getElementById("sendOtpBtn");

                if (button) {

                    button.disabled = false;

                    button.style.pointerEvents =
                        "auto";

                    button.style.cursor =
                        "pointer";

                    console.log(
                        "Send OTP button is ready"
                    );

                }

            }
        );

    </script>

</body>

</html>
