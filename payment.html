<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Payment - PrintFlow</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="logo">💳</div>

    <h1>Razorpay Payment</h1>

    <p class="description">
        Review your order and pay securely via UPI, Cards, Net Banking, or Wallets using Razorpay.
    </p>

    <div class="summary">
        <h3>Order Summary</h3>
        <p id="paymentFile">File: -</p>
        <p id="paymentCopies">Copies: 1</p>
        <p id="paymentSide">Print Side: Double Side</p>
        <p id="paymentOrientation">Orientation: Portrait</p>
        <p id="paymentAmount">Total Amount: ₹2</p>
    </div>

    <div class="button-row" style="margin-top: 22px;">
        <button type="button" id="paymentBackBtn" class="secondary-btn">← Back</button>
        <button type="button" id="payBtn">Pay with Razorpay</button>
    </div>

</div>

<!-- Razorpay Checkout JS SDK -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script src="script.js"></script>

</body>
</html>
