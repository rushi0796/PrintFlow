<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - PrintFlow</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="logo">💳</div>

    <h1>Payment</h1>

    <p class="description">
        Please review your order before completing payment.
    </p>

    <div class="summary">
        <h3>Order Summary</h3>
        <p id="paymentFile"></p>
        <p id="paymentCopies"></p>
        <p id="paymentSide"></p>
        <p id="paymentOrientation">Orientation: -</p>
        <p id="paymentAmount"></p>
    </div>

    <div class="button-row">
        <button type="button" id="paymentBackBtn" class="secondary-btn">← Back</button>
        <button type="button" id="payBtn">Pay Now</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
